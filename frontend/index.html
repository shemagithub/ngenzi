    <!-- Suppress browser extension errors - Must run early in head -->
    <script>
      (function() {
        'use strict';
        // Suppress console errors from browser extensions
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.error = function(...args) {
          const message = args.join(' ');
          if (
            message.includes('content.js') ||
            message.includes('browser is not defined') ||
            message.includes('chrome-extension://') ||
            message.includes('moz-extension://') ||
            message.includes('Download the React DevTools') ||
            message.includes('reactjs.org/link/react-devtools') ||
            message.includes('__REACT_DEVTOOLS') ||
            message.includes('notify')
          ) {
            return; // Silently ignore
          }
          originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
          const message = args.join(' ');
          if (
            message.includes('content.js') ||
            message.includes('browser is not defined') ||
            message.includes('chrome-extension://') ||
            message.includes('moz-extension://')
          ) {
            return; // Silently ignore
          }
          originalWarn.apply(console, args);
        };
        
        // Suppress unhandled errors from extensions (capture phase)
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (
              event.filename.includes('content.js') ||
              event.filename.includes('chrome-extension://') ||
              event.filename.includes('moz-extension://')
            )) ||
            (event.message && (
              event.message.includes('browser is not defined') ||
              event.message.includes('content.js') ||
              event.message.includes('Download the React DevTools') ||
              event.message.includes('reactjs.org/link/react-devtools')
            ))
          ) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
        
        // Suppress unhandled promise rejections from extensions
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? String(event.reason) : '';
          if (
            reason.includes('content.js') ||
            reason.includes('browser is not defined') ||
            reason.includes('chrome-extension://') ||
            reason.includes('moz-extension://')
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
